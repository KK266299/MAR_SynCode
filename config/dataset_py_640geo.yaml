deep_lesion:
 # raw_dir: /extracephonline/medai_data_vvv/hazelhwang/Images_png
  raw_dir: /apdcephfs/share_1290796/hazelhwang/mardataset/Images_png
  dataset_dir: /apdcephfs_cq3/share_1290796/hazelhwang/mardataset
  #dataset_dir: /extracephonline/medai_data_vvv/hazelhwang
  data_list: data/deep_lesion/image_list.txt
  mar_dir: data/deep_lesion/metal_masks
  scale: 0.5
  CTpara:
    imPixNum: 416 #256
    angSize: 0.05
    linSize: 1.8536
    angNum: 640
    SOD: 1075
    imPixScale: '512 / 416 * 0.03' # '512 / 256 * 0.03'
    train_indices: np.arange(0, 1000) * 40
    test_indices: np.arange(0,200) * 10 + 45000-1
    test_mask_indices: [0,1,19,29,35,42,62,63,97,99]
    train_mask_indices: set(range(100))-set([0,1,19,29,35,42,62,63,97,99])
    sinogram_size_x: 640
    sinogram_size_y: 641 #197
    window: '[-175, 275] / 1000 * 0.192 + 0.192'
spineweb:
  raw_dir: data/spineweb/raw # path to the original (unzipped) spineweb data
  dataset_dir: data/spineweb # path to the prepared spineweb data
  max_hu: [2000, 2500] # thresholds of the non-metal/metal HU values
  connected_area: 400 # the size of connected metal area
  image_size: 256 # output image size
  thumbnail_size: 96 # thumbail image size (thumbnail images provide an overview of a volume)
  num_tests: 200 # min number of images for testing
